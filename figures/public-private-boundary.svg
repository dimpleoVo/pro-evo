<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Open Core and Public Evidence Boundary"><style>text{font-family:Arial,sans-serif;fill:#172033}.pub{fill:#eff7ff;stroke:#3d6fa8;stroke-width:2}.priv{fill:#fff6f1;stroke:#b96839;stroke-width:2}.h{font-size:21px;font-weight:700}.s{font-size:15px;fill:#4e6077}.good{font-size:17px;font-weight:700;fill:#177044}.line{stroke:#8291a6;stroke-width:2}</style><text x="45" y="42" style="font-size:25px;font-weight:700">Open Core and Public Evidence Boundary</text><g transform="translate(55 80)"><rect class="pub" rx="12" width="520" height="310"/><text x="260" y="38" text-anchor="middle" class="h">PUBLIC RELEASE</text><text x="38" y="80" class="h">Open Core</text><text x="38" y="106" class="s">schemas · Process Events · target / Intervention abstractions</text><text x="38" y="132" class="s">causal comparison · Offline Replay</text><text x="38" y="177" class="h">Public Evidence</text><text x="38" y="203" class="s">sanitized traces · G/T comparison · result summaries</text><text x="38" y="229" class="s">evidence manifests · Hashes</text><text x="38" y="274" class="h">Documentation</text><text x="38" y="300" class="s">methodology · architecture · Causal Validation · limitations</text></g><g transform="translate(625 80)"><rect class="priv" rx="12" width="520" height="310"/><text x="260" y="38" text-anchor="middle" class="h">NOT INCLUDED</text><text x="38" y="82" class="s">Private Production Runtime · Provider Infrastructure</text><text x="38" y="114" class="s">Private Benchmark Assets · Hidden Evaluator</text><text x="38" y="146" class="s">Raw Provider Responses · Private CoT</text><text x="38" y="178" class="s">Company / Internal Assets · deployment machinery</text></g><line x1="55" y1="420" x2="1145" y2="420" class="line"/><text x="600" y="455" text-anchor="middle" class="good">Method Auditability = YES · Evidence Auditability = YES · Full Private Runtime Reconstructable = NO</text></svg>
