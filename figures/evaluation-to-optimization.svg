<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" role="img" aria-label="Evaluation to optimization pipeline"><style>text{font-family:Arial,sans-serif;fill:#182335}.stage{fill:#f9fbff;stroke:#4871b7;stroke-width:2}.n{font-size:15px;font-weight:bold}.s{font-size:13px;fill:#52637a}.a{stroke:#4871b7;stroke-width:3}</style><text x="40" y="38" style="font-size:23px;font-weight:bold">Evaluation → diagnosis → target → intervention → verification</text><g transform="translate(40,82)"><rect class="stage" rx="10" width="175" height="90"/><text x="88" y="35" text-anchor="middle" class="n">1. Evaluate</text><text x="88" y="59" text-anchor="middle" class="s">public failure signal</text></g><path class="a" d="M215 127h45"/><g transform="translate(260,82)"><rect class="stage" rx="10" width="175" height="90"/><text x="88" y="35" text-anchor="middle" class="n">2. Diagnose</text><text x="88" y="59" text-anchor="middle" class="s">process evidence</text></g><path class="a" d="M435 127h45"/><g transform="translate(480,82)"><rect class="stage" rx="10" width="175" height="90"/><text x="88" y="35" text-anchor="middle" class="n">3. Target</text><text x="88" y="59" text-anchor="middle" class="s">observable condition</text></g><path class="a" d="M655 127h45"/><g transform="translate(700,82)"><rect class="stage" rx="10" width="175" height="90"/><text x="88" y="35" text-anchor="middle" class="n">4. Intervene</text><text x="88" y="59" text-anchor="middle" class="s">same-checkpoint branch</text></g><path class="a" d="M875 127h45"/><g transform="translate(920,82)"><rect class="stage" rx="10" width="140" height="90"/><text x="70" y="35" text-anchor="middle" class="n">5. Verify</text><text x="70" y="59" text-anchor="middle" class="s">public outcome</text></g></svg>

