<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Traditional Agent Evaluation compared with Pro-Evo Evaluation to Optimization"><style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:25px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:14px;fill:#506078}.box{fill:#f7f9fd;stroke:#5372a8;stroke-width:2}.pro{fill:#f2faf6;stroke:#278457;stroke-width:2}.arrow{stroke:#607a9f;stroke-width:3;fill:none}</style><text x="46" y="42" class="t">From final-score Evaluation to process-aware Optimization</text><text x="50" y="88" class="h">Traditional Agent Evaluation</text><g transform="translate(50 110)"><rect class="box" rx="10" width="190" height="80"/><text x="95" y="36" text-anchor="middle" class="h">Task</text><text x="95" y="58" text-anchor="middle" class="s">input</text></g><path class="arrow" d="M240 150h60"/><g transform="translate(300 110)"><rect class="box" rx="10" width="190" height="80"/><text x="95" y="36" text-anchor="middle" class="h">Agent</text><text x="95" y="58" text-anchor="middle" class="s">Execution</text></g><path class="arrow" d="M490 150h60"/><g transform="translate(550 110)"><rect class="box" rx="10" width="210" height="80"/><text x="105" y="36" text-anchor="middle" class="h">Final Score</text><text x="105" y="58" text-anchor="middle" class="s">did it succeed?</text></g><text x="50" y="245" class="h">Pro-Evo process-aware Evaluation and Reliability Optimization</text><g transform="translate(50 270)"><rect class="pro" rx="10" width="135" height="90"/><text x="68" y="38" text-anchor="middle" class="h">Execution</text><text x="68" y="62" text-anchor="middle" class="s">Trace</text></g><path class="arrow" d="M185 315h38"/><g transform="translate(223 270)"><rect class="pro" rx="10" width="145" height="90"/><text x="73" y="31" text-anchor="middle" class="h">Process</text><text x="73" y="53" text-anchor="middle" class="h">Evidence</text></g><path class="arrow" d="M368 315h3